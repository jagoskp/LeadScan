[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "leadscan-sdk"
version = "0.1.0"
description = "LeadScan AI Client SDK (Python)"
authors = ["LeadScan AI Core Team <core-team@leadscan.ai>"]
readme = "README.md"
packages = [{ include = "leadscan_sdk" }]

[tool.poetry.dependencies]
python = "^3.14"
httpx = "^0.27"
leadscan-shared = { path = "../shared", develop = true }
