[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "leadscan-config"
version = "0.1.0"
description = "LeadScan AI Configuration schemas (Python)"
authors = ["LeadScan AI Core Team <core-team@leadscan.ai>"]
readme = "README.md"
packages = [{ include = "leadscan_config" }]

[tool.poetry.dependencies]
python = "^3.14"
pydantic-settings = "^2.0"
leadscan-shared = { path = "../shared", develop = true }
