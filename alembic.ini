# A generic, single-database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, space separated, suitable for sys.path.insert()
# This allows Alembic to find our services/api/src codebase
prepend_syspath = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters for "slug" in filename
truncate_slug_length = 40

# set to 'true' to run the environment during the
# 'revision' command, regardless of autogenerate
revision_environment = false

# set to 'true' to allow autogenerate to detect server defaults
# and other schema options
# format_version = 2

# database connection url - overridden in env.py dynamically
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/leadscan


[post_write_hooks]
# post_write_hooks allows running black/ruff after generating revision
# hooks = ruff, black
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
