name: leadscan_mobile
description: "LeadScan AI Mobile Application (Flutter)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  go_router: ^14.2.0
  get_it: ^7.7.0
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  camera: ^0.11.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  google_mlkit_text_recognition: ^0.13.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/icons/
    - assets/shaders/

