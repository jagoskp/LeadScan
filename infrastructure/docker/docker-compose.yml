version: '3.8'

services:
  # Database - PostgreSQL 18
  database:
    image: postgres:18-alpine
    container_name: leadscan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadscan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache - Redis
  cache:
    image: redis:7-alpine
    container_name: leadscan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local S3 Storage emulator - MinIO
  storage:
    image: minio/minio
    container_name: leadscan-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Temporal Workflow Orchestrator (Dependencies: postgres & elasticsearch or default simple dev server)
  # We use temporalite or standard dev-server for quick orchestration in local development.
  temporal:
    image: temporalio/admin-tools:1.24.0
    container_name: leadscan-temporal-admin
    depends_on:
      - database
    entrypoint: ["/bin/sh", "-c", "echo 'Temporal CLI admin tools initialized'"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
