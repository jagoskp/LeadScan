<body class="dark h-screen w-full flex items-center justify-center bg-on-background font-body-md text-on-primary">
<main class="w-full max-w-md px-margin-mobile md:px-margin-tablet">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-24 h-24 mb-md rounded-lg overflow-hidden bg-surface-container-highest shadow-sm flex items-center justify-center">
<img alt="LeadScan AI Logo" class="w-20 h-20 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDISLHpF7Zadiqtp9rtgg3OrL23IblV66o09ygBnbi_xrEoIfZJRyuG7vZo1g2xcBzSLg0wQeGS6_J9IgZrQav4UycbwbET8dTcGTuSP601Yv6Gmim3bCGYaaNe4no9_zNv_r5rY4iOd3Ou_uUlfxFCOXNJiVCdlPgQcE4rSCu0p3DBVtZAp-eOO46VKSvzS1D3guap-cZNuIT3hDxfB-WPnH7ByExcroNpwWkftpuo6yX_-zPZq_AF_w"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-primary text-center">
                Welcome Back
            </h1>
<p class="font-body-md text-body-md text-secondary-fixed-dim text-center mt-sm">
                Sign in to continue to LeadScan AI
            </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-highest/20 backdrop-blur-md border border-outline-variant/20 rounded-xl p-lg shadow-[0_12px_24px_-8px_rgba(0,0,0,0.5)]">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-primary mb-xs" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-inverse-surface border border-outline/30 rounded-lg text-on-primary font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-primary mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-inverse-surface border border-outline/30 rounded-lg text-on-primary font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline/50 bg-inverse-surface text-primary focus:ring-primary focus:ring-offset-inverse-surface transition-all" type="checkbox"/>
<span class="font-body-md text-body-md text-secondary-fixed-dim group-hover:text-on-primary transition-colors">Remember me</span>
</label>
<a class="font-label-lg text-label-lg text-primary-fixed-dim hover:text-primary-fixed transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full py-3 bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg relative flex items-center">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink-0 mx-4 font-body-md text-body-md text-outline-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center space-x-2 py-2 px-4 bg-inverse-surface hover:bg-surface-container-highest/30 border border-outline-variant/30 rounded-lg transition-colors" type="button">
<span class="font-label-lg text-label-lg text-on-primary">Google</span>
</button>

<span class="font-label-lg text-label-lg text-on-primary">Microsoft</span>
</button>
</div>
<p class="mt-lg text-center font-body-md text-body-md text-secondary-fixed-dim">
                Don't have an account? <a class="text-primary-fixed-dim hover:text-primary-fixed font-label-lg text-label-lg transition-colors" href="#">Request Access</a>
</p>
