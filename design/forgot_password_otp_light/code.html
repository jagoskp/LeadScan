<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary-fixed rounded-full mix-blend-multiply filter blur-[80px] opacity-70 z-0 pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary-fixed rounded-full mix-blend-multiply filter blur-[80px] opacity-60 z-0 pointer-events-none"></div>
<!-- TopAppBar -->

<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">LeadScan AI</h1>
<div class="w-12"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex items-center justify-center p-margin-mobile relative z-10">
<!-- State Container for toggling between Email and OTP -->
<div class="w-full max-w-md w-full relative" id="flow-container">
<!-- Screen 1: Email Entry -->
<div class="glass-card rounded-2xl p-lg shadow-[0_4px_24px_rgba(0,0,0,0.05)] transition-all duration-300" id="email-screen">
<div class="mb-lg">
<div class="w-12 h-12 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="lock_reset">lock_reset</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email address and we'll send you a link to reset your password.</p>
</div>
<form class="space-y-md" id="email-form" onsubmit="event.preventDefault(); showOtpScreen();">
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-md text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="w-full pl-[44px] pr-md py-[12px] bg-[#F8FAFC] border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-[12px] rounded-lg hover:bg-surface-tint active:bg-[#003ea8] transition-colors shadow-sm flex items-center justify-center mt-xl" type="submit">
                        Send Reset Link
                    </button>
</form>
</div>
<!-- Screen 2: OTP Entry (Hidden by default) -->
<div class="glass-card rounded-2xl p-lg shadow-[0_4px_24px_rgba(0,0,0,0.05)] absolute top-0 left-0 w-full opacity-0 pointer-events-none transform translate-x-8 transition-all duration-300" id="otp-screen">
<div class="mb-lg">
<div class="w-12 h-12 rounded-xl bg-secondary-container text-on-secondary-container flex items-center justify-center mb-md">

</div>

<!-- 6-digit OTP Inputs -->

<input class="otp-input w-full h-[56px] text-center font-headline-lg text-headline-lg bg-[#F8FAFC] border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input w-full h-[56px] text-center font-headline-lg text-headline-lg bg-[#F8FAFC] border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input w-full h-[56px] text-center font-headline-lg text-headline-lg bg-[#F8FAFC] border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input w-full h-[56px] text-center font-headline-lg text-headline-lg bg-[#F8FAFC] border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" maxlength="1" type="text"/>

                        </button>
</div>

                        Verify
                    </button>

<script>
        // Simple UI flow logic
        function showOtpScreen() {
            const emailScreen = document.getElementById('email-screen');
            const otpScreen = document.getElementById('otp-screen');
            
            // Hide Email
            emailScreen.classList.add('opacity-0', '-translate-x-8', 'pointer-events-none');
            emailScreen.classList.remove('translate-x-0');
            
            // Show OTP
            setTimeout(() => {
                otpScreen.classList.remove('opacity-0', 'pointer-events-none', 'translate-x-8');
                otpScreen.classList.add('translate-x-0', 'pointer-events-auto');
                
                // Focus first input
                const firstOtpInput = document.querySelector('.otp-input');
                if(firstOtpInput) firstOtpInput.focus();
                
                startTimer();
            }, 150);
        }

        // OTP Input Auto-advance logic
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        otpInputs[index - 1].focus();
                    }
                }
            });
        });

        // Timer Logic
        let timeLeft = 59;
        function startTimer() {
            const timerEl = document.getElementById('countdown');
            const resendBtn = document.getElementById('resend-btn');
            
            const timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerEl.innerHTML = "00:00";
                    resendBtn.disabled = false;
                } else {
                    timerEl.innerHTML = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                    timeLeft -= 1;
                }
            }, 1000);
        }
    </script>
