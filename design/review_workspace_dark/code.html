<style>
        body { background-color: #0F172A; color: #f8f9ff; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-dark {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            color: white;
            transition: all 0.2s ease;
        }
        .input-dark:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
            outline: none;
        }
        .confidence-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .conf-high { background-color: #10B981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
        .conf-med { background-color: #F59E0B; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        .conf-low { background-color: #EF4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="bg-slate-900 text-inverse-primary font-title-md text-title-md docked full-width top-0 flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full z-50 sticky">
<button class="p-2 text-inverse-primary hover:bg-slate-800 rounded-full transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-inverse-primary">Review Workspace</h1>
<button class="p-2 text-inverse-primary hover:bg-slate-800 rounded-full transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col lg:flex-row gap-6 p-4 md:p-margin-tablet max-w-7xl mx-auto w-full">
<!-- Sticky Top Section (Image Viewer) -->
<section class="lg:w-5/12 lg:sticky lg:top-20 self-start w-full">
<div class="glass-panel rounded-xl overflow-hidden relative group shadow-lg">
<div class="aspect-[4/3] w-full bg-slate-800 relative flex items-center justify-center">
<img class="object-cover w-full h-full opacity-90" data-alt="A sleek, modern metallic business card resting inside a translucent, futuristic acrylic case with subtle glowing cyan and green holographic rings radiating from the card. The card features 'LEADPRO ENTERPRISE SOLUTIONS' and 'JOHN SMITH, CEO' engraved on its surface, illuminated by a cool, studio light-mode setup against a pristine white background. The aesthetic is premium enterprise SaaS mixed with high-tech futurism." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgTYJnjt8Dw63FPjqh_336GB3z8eqnUB22GaYnQmO89bUw6GfeHXIn9aVuqTm7mVyGfcY7Z92ciwIjTJY2_vOrVTwuuj2FY-JECtTfjFI4V9b54SW7q1iT4S3aOhdchT6_qbra0a6g6oi5nFyE_EFWmQZiFOqqJFGVsRaQCW48O-BkAYOfsEzuunOIRCQryYcBBgQnBN-q7pJ6Nkb3tslnwb-vJ-GB5QMpl7z2jR0NdJD8HAqIlXSw6A"/>
<!-- Transparent Overlay Controls -->
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-slate-700/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<button class="text-white hover:text-blue-600 p-1 rounded-full"><span class="material-symbols-outlined text-sm">zoom_out</span></button>
<span class="text-white text-xs font-medium px-2">100%</span>
<button class="text-white hover:text-blue-600 p-1 rounded-full"><span class="material-symbols-outlined text-sm">zoom_in</span></button>
<div class="w-px h-4 bg-slate-600 mx-1"></div>
<button class="text-white hover:text-blue-600 p-1 rounded-full"><span class="material-symbols-outlined text-sm">rotate_right</span></button>
</div>
</div>
<div class="p-3 border-t border-slate-700/50 flex justify-between items-center bg-slate-800/50">
<span class="text-xs text-slate-400 font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">image</span> Original Scan
                    </span>
<span class="text-xs text-blue-400 font-medium">Retake</span>
</div>
</div>
</section>
<!-- Middle Section (Extraction Results) -->
<section class="lg:w-7/12 w-full flex flex-col gap-6">
<div class="flex items-center justify-between">
<h2 class="font-title-lg text-title-lg text-white">AI Extraction Results</h2>
<div class="flex items-center gap-3 text-xs">
<span class="flex items-center text-slate-300"><span class="confidence-indicator conf-high"></span> High</span>
<span class="flex items-center text-slate-300"><span class="confidence-indicator conf-med"></span> Med</span>
<span class="flex items-center text-slate-300"><span class="confidence-indicator conf-low"></span> Low</span>
</div>
</div>
<!-- Field List -->
<div class="glass-panel rounded-xl p-6 flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-slate-400 flex items-center">
<span class="confidence-indicator conf-high"></span> Full Name
                    </label>
<div class="relative">
<input class="input-dark w-full rounded-lg px-4 py-3 font-body-md text-white" type="text" value="John Smith"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
</div>
<!-- Company -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-slate-400 flex items-center">
<span class="confidence-indicator conf-high"></span> Company
                    </label>
<div class="relative">
<input class="input-dark w-full rounded-lg px-4 py-3 font-body-md text-white" type="text" value="LeadPro Enterprise Solutions"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
</div>
<!-- Designation -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-slate-400 flex items-center">
<span class="confidence-indicator conf-med"></span> Designation
                    </label>
<div class="relative">
<input class="input-dark w-full rounded-lg px-4 py-3 font-body-md text-white border-amber-500/30" type="text" value="CEO"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-amber-500" title="Review suggested">warning</span>
<button class="text-slate-400 hover:text-white"><span class="material-symbols-outlined text-[20px]">edit</span></button>
</div>
</div>
<!-- Suggestions -->
<div class="flex gap-2 mt-1">
<button class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-full border border-slate-700 transition-colors">Chief Executive Officer</button>
<button class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-full border border-slate-700 transition-colors">Founder</button>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- Mobile -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-slate-400 flex items-center">
<span class="confidence-indicator conf-high"></span> Mobile
                        </label>
<div class="relative">
<input class="input-dark w-full rounded-lg px-4 py-3 font-body-md text-white" type="text" value="+1 (555) 019-2834"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-slate-400 flex items-center">
<span class="confidence-indicator conf-low"></span> Email
                        </label>
<div class="relative">
<input class="input-dark w-full rounded-lg px-4 py-3 font-body-md text-white border-red-500/30" type="email" value="jsmith@leadpro.co"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-red-500" title="Low confidence">error</span>
</div>
</div>
<!-- Suggestions -->
<div class="flex gap-2 mt-1">
<button class="px-3 py-1 bg-blue-900/30 hover:bg-blue-800/40 text-xs text-blue-300 rounded-full border border-blue-800/50 shadow-[0_0_8px_rgba(37,99,235,0.2)] transition-all">john.smith@leadpro.com</button>
</div>
</div>
</div>
</div>
<!-- Additional Detected Data -->
<div class="glass-panel rounded-xl p-5 border-dashed border-2 border-slate-700">
<h3 class="font-title-md text-title-md text-slate-300 mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
                    Additional Detected Data

<div class="flex flex-col gap-3">
<div class="bg-slate-800/50 p-3 rounded-lg flex items-center justify-between group">
<span class="font-body-md text-slate-300">"Enterprise Solutions built for scale"</span>
<div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs text-white rounded-md transition-colors">Custom Field</button>
<button class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs text-white rounded-md transition-colors">Add Note</button>
</div>
</div>
<div class="bg-slate-800/50 p-3 rounded-lg flex items-center justify-between group">
<span class="font-body-md text-slate-300">123 Innovation Drive, Tech Park CA 94043</span>
<div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs text-white rounded-md transition-colors shadow-sm">Map Address</button>
</div>
</div>
</div>
</div>
</section>
</main>

<nav class="bg-slate-900 border-t border-slate-800 shadow-lg docked full-width bottom-0 rounded-t-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 md:hidden">

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">save</span>
<span class="font-label-lg text-label-lg font-bold">Save</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 hover:text-white rounded-2xl px-4 py-2 transition-all w-1/3 mx-1">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label-lg text-label-lg">Sync</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 hover:text-white rounded-2xl px-4 py-2 transition-all w-1/3 mx-1">

<span class="material-symbols-outlined text-[20px]">sync</span> Sync
        </button>
<button class="px-8 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-500 shadow-[0_0_15px_rgba(37,99,235,0.3)] transition-all font-title-md text-title-md font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span> Save Lead
        </button>
