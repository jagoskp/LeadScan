<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Advanced Lead Filters</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "on-tertiary-fixed": "#002109",
                        "inverse-surface": "#213145",
                        "surface-dim": "#cbdbf5",
                        "outline": "#737686",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#c1ffc5",
                        "tertiary-fixed-dim": "#4ae176",
                        "surface-container": "#e5eeff",
                        "tertiary": "#006229",
                        "secondary-fixed-dim": "#bec6e0",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#005321",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "surface-variant": "#d3e4fe",
                        "on-secondary-fixed": "#131b2e",
                        "secondary-fixed": "#dae2fd",
                        "surface": "#f8f9ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "background": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#007e37",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-container": "#5c647a",
                        "on-secondary-fixed-variant": "#3f465c",
                        "primary": "#004ac6",
                        "on-surface": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-tint": "#0053db",
                        "on-background": "#0b1c30",
                        "on-primary-container": "#eeefff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-bright": "#f8f9ff",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#565e74",
                        "tertiary-fixed": "#6bff8f",
                        "surface-container-highest": "#d3e4fe",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-tablet": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom scrollbar for high-density feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c3c6d7; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #737686; 
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col relative font-body-md">
<!-- Mock Background Content to give context to the modal -->
<div class="absolute inset-0 bg-surface-container opacity-50 z-0"></div>
<!-- Bottom Sheet Modal / Large Panel -->
<div class="absolute bottom-0 w-full h-[85vh] bg-surface-container-lowest rounded-t-[24px] shadow-lg flex flex-col z-50 overflow-hidden transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle Area -->
<div class="w-full flex justify-center pt-md pb-sm bg-surface-container-lowest cursor-pointer shrink-0">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-lg pb-md flex justify-between items-center border-b border-surface-variant shrink-0">
<h2 class="font-title-lg text-title-lg text-on-surface">Filter Leads</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-lg py-md flex flex-col gap-lg">
<!-- Status Section (Chips) -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">Status</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-4 py-2 rounded-full border border-primary bg-primary-fixed text-on-primary-fixed-variant font-label-lg text-label-lg flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[18px] fill" data-icon="check" data-weight="fill">check</span>
                        New
                    </button>
<button class="px-4 py-2 rounded-full border border-outline bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Contacted</button>
<button class="px-4 py-2 rounded-full border border-outline bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Interested</button>
<button class="px-4 py-2 rounded-full border border-outline bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Qualified</button>
<button class="px-4 py-2 rounded-full border border-outline bg-surface text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Lost</button>
</div>
</section>
<!-- Grid Layout for Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Company Input -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">Company</h3>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="domain">domain</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline bg-[#F8FAFC] text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" placeholder="Search by company name..." type="text"/>
</div>
</section>
<!-- City Input -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">City</h3>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="location_city">location_city</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline bg-[#F8FAFC] text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" placeholder="Filter by city..." type="text"/>
</div>
</section>
<!-- Date Added (Date Picker Mock) -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">Date Added</h3>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline bg-[#F8FAFC] text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" type="date"/>
</div>
</section>
<!-- Google Sync Status (Select/Dropdown Mock) -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">Google Sync</h3>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="sync">sync</span>
<select class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline bg-[#F8FAFC] text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md">
<option value="all">All Sync States</option>
<option value="synced">Synced Successfully</option>
<option value="pending">Sync Pending</option>
<option value="failed">Sync Failed</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</section>
</div>
<!-- Tags Section -->
<section class="flex flex-col gap-sm">
<h3 class="font-title-md text-title-md text-on-surface">Tags</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-3 py-1.5 rounded-lg border border-outline bg-surface text-on-surface-variant font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="label">label</span> Enterprise
                    </button>
<button class="px-3 py-1.5 rounded-lg border border-primary bg-primary-fixed text-on-primary-fixed-variant font-body-md text-body-md transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] fill" data-icon="check" data-weight="fill">check</span> SaaS
                    </button>
<button class="px-3 py-1.5 rounded-lg border border-outline bg-surface text-on-surface-variant font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="label">label</span> Urgent
                    </button>
<button class="px-3 py-1.5 rounded-[8px] border border-dashed border-outline-variant text-on-surface-variant font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
</div>
<!-- Footer Actions -->
<div class="p-md border-t border-surface-variant bg-surface-container-lowest shrink-0 flex justify-end gap-md pb-safe">
<button class="px-6 py-2.5 rounded-lg font-title-md text-title-md text-primary hover:bg-surface-variant transition-colors">Clear All</button>
<button class="px-6 py-2.5 rounded-lg bg-primary text-on-primary font-title-md text-title-md shadow-sm hover:opacity-90 active:scale-95 transition-all">Apply Filters</button>
</div>
</div>
</body></html>
