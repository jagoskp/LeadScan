<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-tablet font-body-md text-on-background">
<main class="w-full max-w-md">
<div class="flex flex-col items-center mb-xl">
<img alt="LeadScan AI Brand Logo" class="w-20 h-20 rounded-xl mb-md object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDISLHpF7Zadiqtp9rtgg3OrL23IblV66o09ygBnbi_xrEoIfZJRyuG7vZo1g2xcBzSLg0wQeGS6_J9IgZrQav4UycbwbET8dTcGTuSP601Yv6Gmim3bCGYaaNe4no9_zNv_r5rY4iOd3Ou_uUlfxFCOXNJiVCdlPgQcE4rSCu0p3DBVtZAp-eOO46VKSvzS1D3guap-cZNuIT3hDxfB-WPnH7ByExcroNpwWkftpuo6yX_-zPZq_AF_w"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs text-center">Log in to LeadScan AI to continue.</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-lg border border-outline-variant/30">
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-[#F8FAFC] text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-lg text-body-lg transition-colors" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline rounded-lg bg-[#F8FAFC] text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-lg text-body-lg transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-md">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed-dim transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-title-md text-title-md text-on-primary bg-primary hover:bg-primary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors mt-lg" type="submit">
                    Log in
                </button>
</form>
<div class="mt-lg relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm">
                        or continue with
                    </span>
</div>
</div>
<div class="mt-lg">
<button class="w-full flex items-center justify-center py-3 px-4 border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors font-label-lg text-label-lg text-on-surface" type="button">
<svg class="w-5 h-5 mr-2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
</div>
<p class="mt-xl text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed-dim transition-colors" href="#">Sign up</a>
</p>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
