<body class="bg-[#121212] min-h-screen text-[#e2e8f0] font-body-md antialiased pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#1e1e1e] border-b border-[#2a2a2a] shadow-sm flex justify-between items-center px-margin-mobile h-16 w-full">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20 transition-colors active:opacity-80">
<span class="material-symbols-outlined text-[#e2e8f0]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-[#e2e8f0]">Help &amp; About</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="pt-24 px-margin-mobile md:px-margin-tablet max-w-3xl mx-auto flex flex-col gap-lg pb-xl">
<!-- Search FAQ -->
<section>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-14 pl-12 pr-4 rounded-lg bg-[#2a2a2a] border border-[#434655] text-[#e2e8f0] focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all font-body-lg placeholder-on-surface-variant" placeholder="Search FAQs..." type="text"/>
</div>
</section>

<button class="flex items-center justify-center gap-sm bg-primary-container text-on-primary-container py-3 px-4 rounded-lg font-title-md hover:bg-primary transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined" data-icon="chat_bubble" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
                Contact Support
            </button>
<button class="flex items-center justify-center gap-sm bg-[#2a2a2a] border border-[#434655] text-[#e2e8f0] py-3 px-4 rounded-lg font-title-md hover:bg-[#333] transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="bug_report">bug_report</span>
                Report a Bug
            </button>
</section>
<!-- Information List -->
<section class="bg-[#1e1e1e] rounded-xl border border-[#2a2a2a] overflow-hidden shadow-sm">
<h2 class="font-title-md text-title-md text-primary-fixed-dim px-md py-sm bg-[#2a2a2a]/50 border-b border-[#2a2a2a]">Legal &amp; Info</h2>

<li class="border-b border-[#2a2a2a] last:border-0">
<button class="w-full flex items-center justify-between px-md py-4 hover:bg-[#2a2a2a]/30 transition-colors group">
<span class="font-body-lg text-[#e2e8f0]">Privacy Policy</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</li>
<li class="border-b border-[#2a2a2a] last:border-0">
<button class="w-full flex items-center justify-between px-md py-4 hover:bg-[#2a2a2a]/30 transition-colors group">
<span class="font-body-lg text-[#e2e8f0]">Terms of Service</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed transition-colors" data-icon="chevron_right">chevron_right</span>

<li class="border-b border-[#2a2a2a] last:border-0">

<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed transition-colors" data-icon="chevron_right">chevron_right</span>
