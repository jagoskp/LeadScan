<script>
        // Simple logic for custom toggles to handle state visually
        document.querySelectorAll('.toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', function() {
                if(this.checked) {
                    this.style.transform = 'translateX(100%)';
                    this.style.borderColor = '#004ac6'; // primary
                    this.nextElementSibling.style.backgroundColor = '#004ac6';
                } else {
                    this.style.transform = 'translateX(0)';
                    this.style.borderColor = '#737686'; // outline
                    this.nextElementSibling.style.backgroundColor = '#d3e4fe'; // surface-variant
                }
            });
            
            // Init state
            if(toggle.checked) {
                 toggle.style.transform = 'translateX(100%)';
                 toggle.style.borderColor = '#004ac6';
                 toggle.nextElementSibling.style.backgroundColor = '#004ac6';
            }
        });
    </script>
