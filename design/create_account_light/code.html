<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LeadScan AI - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#ffffff",
                    "surface-variant": "#d3e4fe",
                    "on-secondary-fixed-variant": "#3f465c",
                    "on-primary-fixed-variant": "#003ea8",
                    "tertiary-fixed-dim": "#4ae176",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#2563eb",
                    "secondary-fixed-dim": "#bec6e0",
                    "outline-variant": "#c3c6d7",
                    "surface-dim": "#cbdbf5",
                    "primary": "#004ac6",
                    "surface": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary": "#006229",
                    "tertiary-fixed": "#6bff8f",
                    "error": "#ba1a1a",
                    "surface-tint": "#0053db",
                    "on-surface": "#0b1c30",
                    "background": "#f8f9ff",
                    "surface-container-high": "#dce9ff",
                    "on-secondary-fixed": "#131b2e",
                    "on-tertiary-container": "#c1ffc5",
                    "on-error": "#ffffff",
                    "primary-fixed": "#dbe1ff",
                    "on-secondary-container": "#5c647a",
                    "surface-container-highest": "#d3e4fe",
                    "inverse-surface": "#213145",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "on-background": "#0b1c30",
                    "secondary": "#565e74",
                    "on-tertiary-fixed": "#002109",
                    "inverse-primary": "#b4c5ff",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "tertiary-container": "#007e37",
                    "surface-container": "#e5eeff",
                    "on-tertiary-fixed-variant": "#005321",
                    "surface-bright": "#f8f9ff",
                    "on-surface-variant": "#434655",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#dae2fd",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed-dim": "#b4c5ff",
                    "secondary-container": "#dae2fd",
                    "on-primary-fixed": "#00174b",
                    "outline": "#737686"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "lg": "24px",
                    "margin-tablet": "24px",
                    "xs": "4px",
                    "xl": "32px",
                    "sm": "8px",
                    "gutter": "16px",
                    "base": "4px",
                    "md": "16px"
            },
            "fontFamily": {
                    "title-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-lg antialiased">
<!-- Top Navigation Placeholder for transactional flow -->
<header class="fixed top-0 w-full bg-background/80 backdrop-blur-md z-40 flex items-center justify-between px-margin-mobile py-md border-b border-transparent">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-2xl icon-fill" data-icon="rocket_launch">rocket_launch</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">LeadScan AI</span>
</div>
<a class="text-on-surface-variant font-label-lg text-label-lg hover:text-primary transition-colors" href="#">Sign In instead</a>
</header>
<main class="w-full max-w-xl mt-24 mb-16 relative">
<!-- Decorative Background Element -->
<div class="absolute -top-32 -left-32 w-64 h-64 bg-primary-container rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-64 h-64 bg-surface-container-high rounded-full blur-3xl opacity-40 pointer-events-none"></div>
<div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-surface-container p-6 md:p-10 relative z-10">
<div class="mb-8 text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Create Enterprise Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join high-performance sales teams optimizing their workflow.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Personal Info Group -->
<fieldset class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Full Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="fullName">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="person">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Company Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="companyName">Company Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="domain">domain</span>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="companyName" name="companyName" placeholder="Acme Corp" required="" type="text"/>
</div>
</div>
</div>
<!-- Work Email -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="workEmail">Work Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="mail">mail</span>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="workEmail" name="workEmail" placeholder="jane.doe@acmecorp.com" required="" type="email"/>
</div>
</div>
<!-- Mobile Number -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="mobileNumber">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="phone_iphone">phone_iphone</span>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="mobileNumber" name="mobileNumber" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
</fieldset>
<!-- Divider -->
<div class="relative py-2">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Security</span>
</div>
</div>
<!-- Security Group -->
<fieldset class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="lock">lock</span>
</span>
<input class="block w-full pl-10 pr-10 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg" data-icon="lock_reset">lock_reset</span>
</span>
<input class="block w-full pl-10 pr-10 py-2.5 bg-[#F8FAFC] border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
</fieldset>
<!-- Terms and Submit -->
<div class="pt-4 space-y-6">
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 font-body-md text-body-md">
<label class="text-on-surface-variant" for="terms">I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms &amp; Conditions</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.</label>
</div>
</div>
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-title-md text-title-md text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors group" type="submit">
                        Create Enterprise Account
                        <span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<p class="text-center mt-6 font-body-md text-body-md text-on-surface-variant">
            Already have an account? <a class="text-primary font-title-md hover:underline" href="#">Log in here</a>
</p>
</main>
</body></html>
