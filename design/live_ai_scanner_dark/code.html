<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LeadScan AI - Live Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary-container": "#2563eb",

                        "tertiary": "#006229",
                        "secondary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#434655",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed": "#6bff8f",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-container": "#5c647a",
                        "secondary-fixed-dim": "#bec6e0",
                        "secondary-container": "#dae2fd",
                        "on-secondary": "#ffffff",

                        "on-secondary-fixed": "#131b2e",
                        "on-primary": "#ffffff",

                        "on-tertiary-fixed": "#002109",

                        "surface-variant": "#d3e4fe",
                        "outline": "#737686",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "background": "#f8f9ff",
                        "on-primary-container": "#eeefff",
                        "surface-tint": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-tablet": "24px",
                        "gutter": "16px",
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "headline-lg": ["Inter"],

                        "body-md": ["Inter"],

                        "display-lg": ["Inter"],

<style>
        .scanner-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        
        .corner-bracket {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid #2563eb;
            transition: all 0.2s ease-in-out;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #2563eb, transparent);
            position: absolute;
            animation: scan 3s linear infinite;
            box-shadow: 0 0 8px #2563eb;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-black text-on-surface h-screen w-screen overflow-hidden relative flex flex-col font-body-md select-none">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-black z-50 transition-all duration-300">
<div class="flex justify-between items-center px-margin-mobile py-2 w-full max-w-screen-xl mx-auto h-[64px]">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-variant/20 text-white hover:bg-surface-variant/30 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
<span class="font-title-lg text-title-lg text-white font-semibold">LeadScan AI</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-variant/20 text-white hover:bg-surface-variant/30 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flash_on</span>
</button>
</div>
</header>
<!-- Main Scanner Canvas -->
<main class="flex-1 relative w-full h-full flex flex-col items-center justify-center bg-zinc-950 overflow-hidden">
<!-- Live Camera Feed Simulation Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-40 mix-blend-luminosity blur-[1px]" data-alt="A dimly lit, modern office desk setting, viewed through a mobile phone camera lens. A sleek, minimalist business card rests on a dark slate surface. Subtle bokeh effect in the background with warm ambient light contrasting against the cool, dark foreground. High-tech, cinematic mood suitable for a premium mobile app scanner interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqa9_N1xEilGnFpAus5W6oEtkO4vw2aCdpXIzG5x9nnvTjTjYzJaS4X5ZJ0A5VgZVefInZC4dlq2fPCGmZ-Fx5yhWNqrXIZzO_iWE4x4UBeHXqFbp6_Mj7nNbdim_WGh4pprTyUJSJ8iNB2jz5GLj4Hc903PpznONMjQGxQYU1I_4iJKIwzfDM0CNZD4YMselk5MehX5aL3xKtCENUeMALpqqTeX1SYUT_hyM-kKKeLQB8O3c0ttuVwQ')"></div>
</div>
<!-- AI Status Indicator -->
<div class="absolute top-margin-mobile left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 bg-tertiary-container/90 backdrop-blur-md px-4 py-2 rounded-full border border-tertiary/50 shadow-lg shadow-tertiary/20">
<div class="w-2 h-2 rounded-full bg-tertiary-fixed-dim animate-pulse"></div>
<span class="font-label-lg text-label-lg text-on-tertiary-container font-semibold tracking-wide uppercase">Ready to Capture</span>
</div>
<!-- Scanning Reticle & Overlay -->
<div class="relative z-10 w-[85%] max-w-sm aspect-[5/3] md:aspect-[16/9]">
<!-- Glow Effect -->
<div class="absolute inset-0 rounded-lg shadow-[0_0_30px_rgba(37,99,235,0.3)] bg-primary-container/5 backdrop-blur-[1px]"></div>
<!-- Smart Crop Corners -->
<div class="corner-bracket corner-tl"></div>
<div class="corner-bracket corner-tr"></div>
<div class="corner-bracket corner-bl"></div>
<div class="corner-bracket corner-br"></div>
<!-- Animated Scan Line -->
<div class="scan-line"></div>
<!-- Auto-Focus Ring Indicator (Center) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 border-2 border-primary-fixed-dim rounded-full scanner-ring flex items-center justify-center">
<div class="w-1 h-1 bg-primary-fixed-dim rounded-full"></div>
</div>
<!-- AI Object Detection Tag -->
<div class="absolute -bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-1.5 bg-black/60 backdrop-blur-sm px-3 py-1 rounded-md border border-surface-variant/30 text-primary-fixed-dim">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-sm text-label-sm font-medium tracking-wider">Business Card • 98%</span>
</div>
</div>
<!-- Helpful Hint Text -->
<div class="absolute bottom-32 z-10 text-center w-full px-8">
<p class="font-body-md text-body-md text-surface-variant/70">Hold device steady over the card</p>
</div>
</main>
<!-- Bottom Controls Area -->
<div class="absolute bottom-0 w-full z-30 bg-gradient-to-t from-black via-black/90 to-transparent pt-12 pb-8 px-6 flex flex-col items-center gap-6">
<!-- Mode Switcher -->
<div class="flex bg-surface-variant/20 backdrop-blur-md rounded-full p-1 border border-surface-variant/10">
<button class="px-6 py-2 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg font-semibold shadow-sm transition-all">
                Auto
            </button>
<button class="px-6 py-2 rounded-full text-surface-variant hover:text-white font-label-lg text-label-lg transition-all">
                Manual
            </button>
</div>
<!-- Capture Button Area -->
<div class="flex items-center justify-center gap-8 w-full max-w-sm">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-variant/20 text-white hover:bg-surface-variant/40 transition-colors">
<span class="material-symbols-outlined">photo_library</span>
</button>
<!-- Shutter Button -->
<button class="w-20 h-20 rounded-full border-4 border-primary-container flex items-center justify-center bg-black/50 hover:bg-primary-container/20 active:scale-95 transition-all group">
<div class="w-16 h-16 bg-white rounded-full group-active:scale-90 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-variant/20 text-white hover:bg-surface-variant/40 transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</div>
</body></html>
