<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;

<body class="bg-surface dark:bg-[#0f172a] text-on-surface dark:text-gray-100 min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top App Bar (Hidden on this transactional screen as per guidelines, replaced with a subtle close/back action) -->
<header class="w-full flex justify-between items-center px-margin-mobile py-4 z-10 sticky top-0 bg-transparent">
<button class="p-2 rounded-full hover:bg-surface-variant/20 transition-colors flex items-center justify-center text-on-surface dark:text-gray-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-title-md text-title-md text-on-surface dark:text-gray-200">Scan Complete</div>
<button class="p-2 rounded-full hover:bg-surface-variant/20 transition-colors flex items-center justify-center text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col relative px-margin-mobile pb-[140px]">

<div class="flex-1 w-full flex items-center justify-center relative mb-lg">
<div class="w-full max-w-sm aspect-[3/4] rounded-xl overflow-hidden shadow-[0_12px_24px_rgba(0,0,0,0.2)] bg-surface-container-lowest dark:bg-gray-800 relative group transition-transform duration-300">

<!-- Crop/Edit Overlay -->
<div class="absolute inset-0 border-2 border-primary/50 m-4 rounded-lg pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-primary-container -mt-1 -ml-1"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-primary-container -mt-1 -mr-1"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-primary-container -mb-1 -ml-1"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-primary-container -mb-1 -mr-1"></div>
</div>
</div>
</div>
<!-- Success Message -->
<div class="text-center mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface dark:text-white mb-xs">3 Pages Captured</h2>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-gray-400">Quality looks good. Ready to extract data.</p>
</div>
<!-- Horizontal Scrollable Strip for Thumbnails -->
<div class="w-full mb-6">
<div class="flex space-x-gutter overflow-x-auto hide-scrollbar snap-x snap-mandatory px-2 py-2">
<!-- Thumbnail 1 (Active) -->
<div class="flex-none snap-start relative">
<div class="w-20 h-28 rounded-lg overflow-hidden border-2 border-primary bg-surface-container-low dark:bg-gray-800 shadow-sm relative">
<img class="w-full h-full object-cover" data-alt="A small thumbnail image showing a slightly blurred, top-down view of a modern business card or contact form on a dark background, dimly lit with a blueish tint." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwzA0hGLRpMP8RrqVAAZEeyQsIAcknEchIRmBfvdu1pCF-RExatQ_NQ1KBr9yZ9uzymx4GF6owgkDMcd7PUIYvnLUh9QcOUPQqvECFtTNe9qonyv54XEGs-Bf7dre3Z1U7z-fmFw-hoRHq-ktj7qP1hYbCQMp1v18ofNHSJ_qEUkAHnn1CcA_zaoDqJ-CTh9nBb4mGYY2p5cvLhCyD7lPVfEtr9pL8sqPiLmrdR4EQMiCd6VA7HniqSA"/>

</div>
</div>
<!-- Thumbnail 2 -->

<div class="w-20 h-28 rounded-lg overflow-hidden border-2 border-transparent bg-surface-container-low dark:bg-gray-800 shadow-sm relative">
<img class="w-full h-full object-cover" data-alt="A small thumbnail image showing a slightly blurred, top-down view of a second page of a corporate document on a dark background, dimly lit." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBotjhAXl78oc3a4kdkihJvEaGpScLgkT-xJiErCVVvLPUSV8Fo-Psdg8mtoA9hK_eajbKFYYp7S7KjswKVLl2ZyXXWuLFfJdd-Zw3G66ayq47Y9T0Me7oevsbO5xEzwqE9WM2eNRw-wiusp2iC5DVXGa4UUdaElgrAHeAFAbK43HrR8s4zyTN6PioYvqLovqwYX5wm0rVphxHMVeT-NELvEUvtEF9jtWu-iK3pxjASE2aeBK8UE321mQ"/>
<div class="absolute top-1 right-1 bg-surface/80 dark:bg-gray-700/80 text-on-surface dark:text-gray-300 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold">2</div>
</div>
</div>
<!-- Thumbnail 3 -->
<div class="flex-none snap-start relative opacity-70 hover:opacity-100 transition-opacity">
<div class="w-20 h-28 rounded-lg overflow-hidden border-2 border-transparent bg-surface-container-low dark:bg-gray-800 shadow-sm relative">
<img class="w-full h-full object-cover" data-alt="A small thumbnail image showing a slightly blurred, top-down view of a third page with handwritten notes on a dark background, dimly lit." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3njPGDXN4d-2AMwgU1fx-A13iRMsXyKZPbetPNveVrtiCErxvz3j4CHUz4TVGZz5JqVdvAiC6vocuvh06oG4FWX3mBAExQYnLLTJHltDoMvUIGY9rw5Ab83QZxzUKjyFzuVjjBnWPQpXkQDIYfpcndPjXcZyKQRM2OrasUx8Qo5Q67zKzhMIpCJsXSMSajz4J7_R2TnIC4N8p1MVQHl4Pi16ThBFbpm4khh8F7hCJ5Dh1BZnk9TKugA"/>
<div class="absolute top-1 right-1 bg-surface/80 dark:bg-gray-700/80 text-on-surface dark:text-gray-300 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold">3</div>
</div>
</div>
<!-- Add Page Action in Strip -->
<div class="flex-none snap-start">
<button class="w-20 h-28 rounded-lg border-2 border-dashed border-outline-variant dark:border-gray-600 bg-surface/50 dark:bg-gray-800/50 flex flex-col items-center justify-center text-on-surface-variant dark:text-gray-400 hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">add_circle</span>
<span class="font-label-sm text-label-sm">Add Page</span>
</button>
</div>
</div>
</div>
</main>

<div class="flex space-x-gutter">
<button class="flex-1 bg-transparent border border-outline-variant dark:border-gray-600 text-on-surface dark:text-gray-200 rounded-lg py-3 flex items-center justify-center font-label-lg text-label-lg hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined mr-2 text-[18px]" style="font-variation-settings: 'FILL' 0;">replay</span>
                    Retake
                </button>
<button class="flex-1 bg-transparent border border-outline-variant dark:border-gray-600 text-on-surface dark:text-gray-200 rounded-lg py-3 flex items-center justify-center font-label-lg text-label-lg hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined mr-2 text-[18px]" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
                    Add Page
                </button>
</div>
</div>
</div>
</body></html>
