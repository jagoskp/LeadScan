<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
<div class="absolute top-40 -left-40 w-96 h-96 bg-secondary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-tablet z-10 relative">
<div class="w-full max-w-md">
<!-- Logo / Brand Identity -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary tracking-tight">LeadScan AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Secure your account</p>
</div>
<!-- Reset Password Card -->
<div class="glass-panel rounded-xl shadow-[0_12px_40px_-12px_rgba(0,0,0,0.08)] p-lg md:p-xl transition-all duration-500 relative overflow-hidden" id="reset-form-container">
<h2 class="font-title-lg text-title-lg text-on-surface mb-lg text-center">Reset Password</h2>
<form class="space-y-lg" id="reset-password-form">
<!-- New Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-[#F8FAFC] border border-outline-variant text-on-surface rounded-lg px-md py-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-outline font-body-md text-body-md" id="new-password" placeholder="Enter new password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary p-xs" onclick="togglePassword('new-password', 'eye-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-1">visibility_off</span>
</button>
</div>
</div>
<!-- Password Strength Indicator -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">Password Strength:</span>
<span class="font-label-sm text-label-sm font-semibold text-secondary" id="strength-text">None</span>
</div>
<div class="flex gap-1 h-[6px] rounded-full overflow-hidden bg-surface-container-high">
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="strength-bar-1"></div>
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="strength-bar-2"></div>
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="strength-bar-3"></div>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-[#F8FAFC] border border-outline-variant text-on-surface rounded-lg px-md py-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-outline font-body-md text-body-md" id="confirm-password" placeholder="Confirm new password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary p-xs" onclick="togglePassword('confirm-password', 'eye-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-2">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-error mt-xs hidden" id="match-error">Passwords do not match.</p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-sm px-md rounded-lg hover:bg-surface-tint transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:outline-none flex justify-center items-center gap-xs" onclick="handleReset()" type="button">
                        Update Password
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Success State Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface/95 backdrop-blur-sm flex flex-col items-center justify-center p-lg opacity-0 pointer-events-none transition-opacity duration-500 z-20" id="success-state">
<div class="w-16 h-16 rounded-full bg-tertiary-container flex items-center justify-center mb-md scale-50 transition-transform duration-500 delay-100" id="success-icon">
<span class="material-symbols-outlined text-[32px] text-on-tertiary-container">check_circle</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs text-center">Password Updated!</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg">Your password has been successfully reset.</p>
<button class="bg-surface border border-outline-variant text-on-surface font-title-md text-title-md py-sm px-lg rounded-lg hover:bg-surface-container-low transition-colors" onclick="window.location.reload()">
                        Back to Login
                    </button>
</div>
</div>
<div class="mt-lg text-center">
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">Return to login screen</a>
</div>
</div>
</main>
<script>
        // Password Visibility Toggle
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility";
            } else {
                input.type = "password";
                icon.textContent = "visibility_off";
            }
        }

        // Real-time Password Strength Logic
        const passwordInput = document.getElementById('new-password');
        const confirmInput = document.getElementById('confirm-password');
        const strengthText = document.getElementById('strength-text');
        const b1 = document.getElementById('strength-bar-1');
        const b2 = document.getElementById('strength-bar-2');
        const b3 = document.getElementById('strength-bar-3');

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let strength = 0;
            
            if (val.length > 0) strength += 1;
            if (val.length >= 8) strength += 1;
            if (val.match(/[A-Z]/) && val.match(/[0-9]/)) strength += 1;
            
            // Reset colors
            b1.className = 'h-full w-1/3 bg-transparent transition-colors duration-300';
            b2.className = 'h-full w-1/3 bg-transparent transition-colors duration-300';
            b3.className = 'h-full w-1/3 bg-transparent transition-colors duration-300';
            strengthText.className = 'font-label-sm text-label-sm font-semibold';

            if (val.length === 0) {
                strengthText.textContent = 'None';
                strengthText.classList.add('text-secondary');
            } else if (strength === 1) {
                strengthText.textContent = 'Weak';
                strengthText.classList.add('text-error');
                b1.classList.replace('bg-transparent', 'bg-error');
            } else if (strength === 2) {
                strengthText.textContent = 'Fair';
                strengthText.classList.add('text-[#F59E0B]'); // Warning color not explicitly in config, using hex for fair
                b1.classList.replace('bg-transparent', 'bg-[#F59E0B]');
                b2.classList.replace('bg-transparent', 'bg-[#F59E0B]');
            } else if (strength === 3) {
                strengthText.textContent = 'Strong';
                strengthText.classList.add('text-tertiary');
                b1.classList.replace('bg-transparent', 'bg-tertiary');
                b2.classList.replace('bg-transparent', 'bg-tertiary');
                b3.classList.replace('bg-transparent', 'bg-tertiary');
            }
        });

        // Form Submission Simulation
        function handleReset() {
            const p1 = passwordInput.value;
            const p2 = confirmInput.value;
            const errorMsg = document.getElementById('match-error');

            if (p1 !== p2 || p1 === '') {
                errorMsg.classList.remove('hidden');
                confirmInput.classList.add('border-error', 'focus:ring-error', 'focus:border-error');
                return;
            }
            
            errorMsg.classList.add('hidden');
            confirmInput.classList.remove('border-error', 'focus:ring-error', 'focus:border-error');

            // Show Success State
            const successState = document.getElementById('success-state');
            const successIcon = document.getElementById('success-icon');
            
            successState.classList.remove('opacity-0', 'pointer-events-none');
            successState.classList.add('opacity-100', 'pointer-events-auto');
            
            setTimeout(() => {
                successIcon.classList.remove('scale-50');
                successIcon.classList.add('scale-100');
            }, 50);
        }
    </script>
</body></html>
