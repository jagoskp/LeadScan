<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Biometric Login - LeadScan AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "surface-variant": "#d3e4fe",

                        "surface-dim": "#cbdbf5",
                        "primary": "#004ac6",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary": "#006229",
                        "tertiary-fixed": "#6bff8f",
                        "error": "#ba1a1a",
                        "surface-tint": "#0053db",
                        "on-surface": "#0b1c30",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#131b2e",
                        "on-tertiary-container": "#c1ffc5",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-container": "#5c647a",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-background": "#0b1c30",
                        "secondary": "#565e74",
                        "on-tertiary-fixed": "#002109",
                        "inverse-primary": "#b4c5ff",

                        "tertiary-container": "#007e37",
                        "surface-container": "#e5eeff",
                        "on-tertiary-fixed-variant": "#005321",
                        "surface-bright": "#f8f9ff",
                        "on-surface-variant": "#434655",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#dae2fd",
                        "surface-container-low": "#eff4ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary-container": "#dae2fd",
                        "on-primary-fixed": "#00174b",
                        "outline": "#737686"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "margin-tablet": "24px",

                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "16px",

                        "md": "16px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],

                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {

                }
            }
        }

<style>
        .glowing-aura {
            box-shadow: 0 0 40px 10px rgba(0, 74, 198, 0.15);
            animation: pulse-aura 3s infinite ease-in-out;
        }
        @keyframes pulse-aura {
            0% { box-shadow: 0 0 40px 10px rgba(0, 74, 198, 0.15); transform: scale(1); }
            50% { box-shadow: 0 0 60px 20px rgba(0, 74, 198, 0.25); transform: scale(1.02); }
            100% { box-shadow: 0 0 40px 10px rgba(0, 74, 198, 0.15); transform: scale(1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden">
<!-- Top App Bar (Modified for Login - No Navigation Shell) -->
<header class="flex items-center justify-between px-margin-mobile py-md w-full bg-background flat no shadows">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-title-lg text-title-lg text-primary">LeadScan AI</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pb-xl">
<!-- Illustration Area -->
<div class="mb-xl relative flex items-center justify-center">
<div class="w-48 h-48 bg-surface-container-low rounded-full flex items-center justify-center glowing-aura relative z-10">
<span class="material-symbols-outlined text-primary" data-icon="fingerprint" style="font-size: 80px;">fingerprint</span>
</div>
<!-- Decorative background elements -->
<div class="absolute inset-0 w-full h-full bg-surface-variant opacity-20 rounded-full blur-3xl z-0"></div>
</div>
<!-- Text Content -->
<div class="text-center mb-xl max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-sm">Secure Access</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Use biometrics for faster and more secure access to your leads.
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-sm flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-md rounded-lg flex items-center justify-center gap-sm shadow-sm hover:bg-surface-tint transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
                Enable Fingerprint
            </button>
<button class="w-full bg-surface text-primary border border-outline-variant font-title-md text-title-md py-md rounded-lg flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="face">face</span>
                Face Unlock
            </button>
<button class="w-full mt-sm text-secondary font-label-lg text-label-lg py-sm hover:text-primary transition-colors active:scale-95">
                Skip for now
            </button>
</div>
</main>
</body></html>
