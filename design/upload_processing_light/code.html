<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .pulse-animation {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-border {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(37, 99, 235, 0);
            }
        }

            transition: width 0.3s ease-out;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-md h-16 bg-surface">
<div class="flex-none w-12 h-12 flex items-center justify-center">
<!-- Hidden leading icon to maintain center alignment if needed, but per instructions, we want a close icon. The prompt asked for a Close (X) icon in a TopAppBar for a processing screen. 
                 Using trailing for close or leading for close depends on standard, usually close is leading on modals, but let's put it leading. -->
<button class="w-12 h-12 rounded-full flex items-center justify-center hover:bg-surface-container-high transition-colors active:scale-95 duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<div class="flex-grow flex justify-center items-center">
<h1 class="font-title-lg text-title-lg font-bold text-on-surface">Processing</h1>
</div>
<div class="flex-none w-12 h-12">
<!-- Empty space to balance the header -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-24 px-margin-mobile md:px-margin-tablet pb-12 flex flex-col items-center max-w-2xl mx-auto w-full">
<!-- Image Preview Card -->
<div class="w-full relative rounded-2xl overflow-hidden shadow-sm border border-outline-variant bg-surface-container-lowest pulse-animation mb-lg group">
<div class="aspect-square w-full relative">
<!-- Using the provided image placeholder -->
<img alt="3D business card scanning illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLuO5JL-0tgcvK3esIdECIbPwRsubJ893IcV7BBqB1pWPSqMvWXH5GvA0urrQHMS0R5ABOatIaktI4yjjHXu9VNEFsleLQxf0i-RwZVsKxJ-eAg6hyXBmacEw4Sixxutye9OJEjqM6E7NjxPqYBUsd2cCQoC2GMmpV01zcAaKD0qiS2Z7rfabl2S9h9pQ5VzlHNKsxv0rzGGdDaLEkqpA_BQgeA5kJFLu9Uo7EKtt6Aipxe1TKHdgi74-9ga"/>
<!-- Overlay -->
<div class="absolute inset-0 bg-on-surface/40 flex flex-col items-center justify-center p-md">
<div class="glass-card rounded-xl p-md flex flex-col items-center w-full max-w-[240px]">
<span class="font-title-md text-title-md text-on-surface mb-sm">Uploading Document</span>
<div class="flex items-center space-x-xs mb-xs">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">75</span>
<span class="font-title-lg text-title-lg text-primary">%</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden mt-sm">
<div class="h-full bg-primary rounded-full progress-bar-fill" style="width: 75%;"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Status Area -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-md flex flex-col space-y-md">
<h2 class="font-title-md text-title-md text-on-surface pb-xs border-b border-surface-container-high">Extraction Status</h2>
<ul class="space-y-sm">
<!-- Status Item 1: Complete -->
<li class="flex items-center space-x-sm">
<div class="w-8 h-8 rounded-full bg-tertiary-container/10 flex items-center justify-center flex-shrink-0 text-tertiary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Image Validation</span>
</div>
</li>
<!-- Status Item 2: Complete -->
<li class="flex items-center space-x-sm">
<div class="w-8 h-8 rounded-full bg-tertiary-container/10 flex items-center justify-center flex-shrink-0 text-tertiary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">AI Initialization</span>
</div>
</li>
<!-- Status Item 3: In Progress (Pulsing) -->
<li class="flex items-center space-x-sm bg-surface-container-low p-sm -mx-sm rounded-lg">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0 text-primary">
<span class="material-symbols-outlined animate-spin" style="font-variation-settings: 'FILL' 0;">sync</span>
</div>
<div class="flex-grow">
<span class="font-title-md text-title-md text-primary">Preparing Scan...</span>
</div>
</li>
</ul>
</div>
