<style>
        .scanner-overlay {
            background: linear-gradient(to bottom, rgba(11, 28, 48, 0.4) 0%, rgba(11, 28, 48, 0.1) 20%, rgba(11, 28, 48, 0.1) 80%, rgba(11, 28, 48, 0.8) 100%);
        }
        .scanning-line {
            animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            background: linear-gradient(to bottom, transparent, rgba(37, 99, 235, 0.8), transparent);
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .glass-panel {
            background: rgba(248, 249, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(11, 28, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface flex justify-between items-center px-margin-mobile py-2 max-w-screen-xl mx-auto z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container flex items-center justify-center border border-outline-variant cursor-pointer hover:bg-surface-variant/50 transition-colors active:scale-95 duration-200">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a young business person smiling softly, clean lighting, white background, conveying trustworthiness and modern enterprise professionalism." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJOR-QhDsFwc7NPYObatTRCaDq7SmcwbjQ8-ycI5wUhSQvX0y3YR0ytk3X5DhM8p9NAjGjzq80_WkYyOd7HmKwdMueOw3HrebQyvVC0VHWN9T4jhBaVeOlx0UdNrnBmcMBdxhMs7XxlWKSPRTb7V0s2k8ETd20Cqr77Fbe9hQD_PME2GseASkqQUPvnC5iHgQbWOY7dEuusf2nIxx7wPXlRT2Vno7belUfO9cO3dYj5f2Q0uUnI8ujSg"/>
</div>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
            LeadScan AI
        </div>
<div class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 transition-colors active:scale-95 duration-200 cursor-pointer text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</div>
</header>
<!-- Main Scanner View (Camera Feed Area) -->
<main class="relative flex-grow w-full bg-inverse-surface overflow-hidden">
<!-- Viewfinder Background (Simulated Camera Feed) -->
<div class="absolute inset-0 w-full h-full">
<img class="w-full h-full object-cover opacity-80" data-alt="A close-up, slightly blurred view through a smartphone camera lens aiming at a modern, minimalist business card lying on a clean white desk. Bright, natural lighting, high depth of field, professional corporate setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqVFxc_RobTKdcAMezvPcInagCuVlEx3ygv-qOeU9aVdJXpXKK_AoZRkz-6ogBIZlZXqSO5ULaiyrH8haWyTdj-pXf3ByA4JfL7WodLa9Mk9QCH9C5bJ-sxWah1Swzzl2S580TwDrXOTvpvWZdGupV3X4PTpcQgIiMoVeY9M7Tf50qaMEYG9B17LJihLjUWYqki9-IiPwFcJhnRyhgBIX3iCXynV48uIUwB4UrovVkHgfPUVjO4YfFTQ"/>
<div class="absolute inset-0 scanner-overlay pointer-events-none"></div>
</div>
<!-- AI Detection Reticle -->
<div class="absolute inset-x-8 top-32 bottom-48 border-2 border-primary-container/80 rounded-xl pointer-events-none shadow-[0_0_24px_rgba(37,99,235,0.4)]">
<!-- Corner Accents -->
<div class="absolute -top-[2px] -left-[2px] w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute -top-[2px] -right-[2px] w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute -bottom-[2px] -left-[2px] w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute -bottom-[2px] -right-[2px] w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Animated Scanning Line -->
<div class="absolute left-0 w-full h-1 scanning-line z-10 pointer-events-none"></div>
<!-- AI Confidence Badge -->
<div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-primary text-on-primary px-3 py-1 rounded-full font-label-sm flex items-center gap-1 shadow-md">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
                Business Card (98%)
            </div>
</div>
<!-- Floating Controls (Top Right) -->
<div class="absolute top-4 right-4 flex flex-col gap-4 z-20">
<button aria-label="Toggle Flash" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-on-surface active:scale-90 transition-all duration-150 shadow-sm">
<span class="material-symbols-outlined">flash_on</span>
</button>
<button aria-label="Toggle Auto/Manual" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-on-surface active:scale-90 transition-all duration-150 shadow-sm">
<span class="material-symbols-outlined">hdr_auto</span>
</button>
</div>
<!-- Document Type Selector (Bottom of Viewfinder) -->
<div class="absolute bottom-28 left-0 w-full flex justify-center z-20 px-4">
<div class="glass-panel rounded-full flex p-1 shadow-md">
<button class="px-6 py-2 rounded-full font-label-lg bg-surface text-on-surface shadow-sm transition-all">Card</button>
<button class="px-6 py-2 rounded-full font-label-lg text-on-surface-variant hover:text-on-surface transition-all">Doc</button>
<button class="px-6 py-2 rounded-full font-label-lg text-on-surface-variant hover:text-on-surface transition-all">Screen</button>
</div>
</div>
<!-- Bottom Capture Area -->
<div class="absolute bottom-0 left-0 w-full h-32 glass-panel rounded-t-3xl flex items-center justify-between px-8 z-30 pb-4">
<!-- Recent Scan Thumbnail -->
<div class="w-14 h-14 rounded-lg overflow-hidden border-2 border-outline-variant bg-surface-container-high shadow-sm cursor-pointer active:scale-95 transition-all">
<img class="w-full h-full object-cover" data-alt="A tiny thumbnail image of a previously scanned corporate business card showing a minimal logo and contact details. Clear, readable, high contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNHNemLb3LuQ4NDbwJHt9J2dbmYA13KVOVmW-3L_Vnzr65wI73XuDJ8xFNBcid9WqiVAVCRiS4CcPKzDcTm8DD_t2RS1XoHXDSDR8EWqBzcur8q9Wgc_i47mARgHF-1IhbVR7lz34VaI15WKwZR8Fo7Sn239y-AMnlYKxP-m1XcrjvBnJPZXJWucUejCKBHpBUcIZfLxmHUQ0kczYL0rWqTj9D6d_ZjH8ErU2xVHqb2BssSbYMnugyPw"/>
</div>
<!-- Prominent Capture Button -->
<div class="relative w-20 h-20 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<button class="w-16 h-16 rounded-full bg-primary text-on-primary shadow-lg flex items-center justify-center active:scale-90 transition-transform duration-150 border-4 border-white hover:bg-primary-container">
<span class="material-symbols-outlined text-[32px]">camera</span>
</button>
</div>
<!-- Batch Mode Toggle (Placeholder for balance) -->
<div class="w-14 h-14 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/50 cursor-pointer active:scale-95 transition-all">
<span class="material-symbols-outlined">library_add</span>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop, shown on mobile) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface dark:bg-surface z-50 rounded-t-xl shadow-[0_-1px_4px_0_rgba(0,0,0,0.05)] md:hidden">
<!-- Scanner (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-2xl px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 duration-150 w-1/3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
<span class="font-label-sm text-label-sm mt-1">Scanner</span>
</button>
<!-- Leads (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-secondary-fixed-dim px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 duration-150 w-1/3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person_search</span>
<span class="font-label-sm text-label-sm mt-1">Leads</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-secondary-fixed-dim px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 duration-150 w-1/3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
