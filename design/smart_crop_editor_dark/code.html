<style>
        body {
            background-color: #0b1c30; /* Forcing dark background for the editor */
            color: #ffffff;
        }
        /* Custom slider styles for the editor */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #b4c5ff; /* primary-fixed-dim */
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #434655; /* on-surface-variant */
            border-radius: 2px;
        }
        
        .crop-handle {
            width: 24px;
            height: 24px;
            background-color: transparent;
            border: 3px solid #b4c5ff;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .crop-line {
            position: absolute;
            background-color: rgba(180, 197, 255, 0.5);
            z-index: 9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-margin-mobile py-4 w-full max-w-screen-xl mx-auto sticky top-0 z-50 bg-[#0b1c30]">
<button class="text-primary-fixed-dim hover:bg-surface-variant/20 transition-colors px-4 py-2 rounded-lg font-title-md text-title-md active:scale-95 duration-200">
            Cancel
        </button>
<h1 class="font-title-lg text-title-lg font-semibold text-primary-fixed-dim">Crop &amp; Edit</h1>
<button class="bg-primary-container text-on-primary-container hover:bg-surface-variant/20 transition-colors px-4 py-2 rounded-lg font-title-md text-title-md active:scale-95 duration-200">
            Done
        </button>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow relative flex items-center justify-center p-margin-mobile overflow-hidden">
<div class="relative w-full max-w-md aspect-[3/4] bg-surface-variant rounded-xl overflow-hidden shadow-[0_12px_24px_rgba(0,0,0,0.3)]">
<!-- Simulated Camera Feed / Captured Image -->
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A close-up, high-quality photograph of a modern, sleek business card lying on a dark wooden desk. The lighting is dramatic but clear, highlighting the text on the card. The surrounding area is slightly out of focus, emphasizing the card. The overall mood is professional and premium, fitting an enterprise software context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXtm829XepER22POssXjjnyqxQ6owElJNZUAhd8Ht3LJLkfeSzx8NwYsOW_vyikRansP6YHRGHcOtyCUHRSm2GRuHw3XnUawjwpX3hvYyoM75g8_t2y0qSkZ9DI2koa7PUZoYpPhc7u7Y8w-F-A4UsJab6Kq43-8eTwA0P5tvxhKKJGOnluBR9vTxDReVKzDoXhgkb848moy0aybloZ932_8v1f3mI4T0PJ7Apr-e4BifUC_OvBHkX3Q"/>
<!-- Dark Overlay outside crop area -->
<div class="absolute inset-0 bg-black/50 pointer-events-none"></div>
<!-- Smart Crop Interactive Area -->
<div class="absolute inset-8 pointer-events-auto">
<!-- Crop area cutout (simulated with a pseudo-element or inner div in a real app, here just a bright border) -->
<div class="absolute inset-0 border-2 border-primary-fixed-dim bg-transparent z-0 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)]"></div>
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-evenly pointer-events-none z-10">
<div class="w-full h-[1px] bg-primary-fixed-dim/30"></div>
<div class="w-full h-[1px] bg-primary-fixed-dim/30"></div>
</div>
<div class="absolute inset-0 flex flex-row justify-evenly pointer-events-none z-10">
<div class="h-full w-[1px] bg-primary-fixed-dim/30"></div>
<div class="h-full w-[1px] bg-primary-fixed-dim/30"></div>
</div>
<!-- Handles -->
<div class="crop-handle top-0 left-0"></div>
<div class="crop-handle top-0 left-full"></div>
<div class="crop-handle top-full left-0"></div>
<div class="crop-handle top-full left-full"></div>
</div>
<!-- Auto-detect indicator -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 bg-surface-container-high/80 backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">document_scanner</span>
<span class="font-label-sm text-label-sm text-on-surface">Auto-detected</span>
</div>
</div>
</main>
<!-- Bottom Toolbar / Controls -->
<section class="bg-[#131b2e] rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,0.2)] pb-safe relative z-40">
<!-- Adjustment Sliders -->
<div class="px-margin-mobile py-6 flex flex-col gap-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">light_mode</span>
<input class="flex-grow" max="100" min="0" type="range" value="50"/>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">contrast</span>
<input class="flex-grow" max="100" min="0" type="range" value="65"/>
</div>
</div>
<!-- Tool Icons -->
<div class="flex justify-around items-center px-4 py-4 border-t border-outline-variant/20">
<button class="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-surface-variant/20 text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">rotate_right</span>
<span class="font-label-sm text-label-sm">Rotate</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-surface-variant/20 text-primary-fixed-dim bg-surface-variant/10">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">transform</span>
<span class="font-label-sm text-label-sm">Perspective</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-surface-variant/20 text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">auto_awesome</span>
<span class="font-label-sm text-label-sm">Enhance</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-surface-variant/20 text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">filter_b_and_w</span>
<span class="font-label-sm text-label-sm">B&amp;W</span>
</button>
</div>
</section>
</body></html>
