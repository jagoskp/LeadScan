[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "leadscan-api"
version = "0.1.0"
description = "LeadScan AI API Gateway (FastAPI)"
authors = ["LeadScan AI Core Team <core-team@leadscan.ai>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.111"
uvicorn = "^0.30"
sqlalchemy = "^2.0"
alembic = "^1.13"
argon2-cffi = "^23.1.0"
pyjwt = "^2.8.0"
asyncpg = "^0.29.0"
pydantic = { extras = ["email"], version = "^2.0.0" }
leadscan-shared = { path = "../../packages/shared", develop = true }
leadscan-config = { path = "../../packages/config", develop = true }
leadscan-sdk = { path = "../../packages/sdk", develop = true }
