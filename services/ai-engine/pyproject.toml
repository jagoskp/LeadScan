[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "leadscan-ai-engine"
version = "0.1.0"
description = "LeadScan AI Engine background processor"
authors = ["LeadScan AI Core Team <core-team@leadscan.ai>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.111"
uvicorn = "^0.30"
leadscan-shared = { path = "../../packages/shared", develop = true }
leadscan-config = { path = "../../packages/config", develop = true }
