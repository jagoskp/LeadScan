apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadscan-worker
  namespace: leadscan
  labels:
    app: leadscan-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leadscan-worker
  template:
    metadata:
      labels:
        app: leadscan-worker
    spec:
      containers:
        - name: worker
          image: leadscan-worker:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          envFrom:
            - configMapRef:
                name: leadscan-config
            - secretRef:
                name: leadscan-secrets
