apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: leadscan-network-policy
  namespace: leadscan
spec:
  podSelector:
    matchLabels:
      app: leadscan-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
